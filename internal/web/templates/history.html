{{define "content"}}
{{with .Data}}
<h1>History of <a href="{{docpath $.SpacePath .Node.PublicID .Node.Slug}}">{{.Node.Title}}</a></h1>
<table>
  <thead><tr><th>Version</th><th>Date</th><th>Author</th><th>Comment</th><th></th></tr></thead>
  <tbody>
  {{range .Revisions}}
  <tr>
    <td><a href="{{$.SpacePath}}/history/{{$.Data.Node.PublicID}}/{{.Version}}">{{.Version}}</a></td>
    <td>{{date .CreatedAt}}</td>
    <td>{{.Author}}</td>
    <td>{{.Comment}}</td>
    <td>{{if and ($.Can "doc.edit") (ne .Version $.Data.Node.Version)}}<a href="{{$.SpacePath}}/edit/{{$.Data.Node.PublicID}}?from={{.Version}}">Restore</a>{{end}}</td>
  </tr>
  {{end}}
  </tbody>
</table>
{{end}}
{{end}}
