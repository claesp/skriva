{{define "content"}}
<h1>History of <a href="/wiki/{{.Data.Page.Slug}}">{{.Data.Page.Title}}</a></h1>
<table>
  <thead><tr><th>Version</th><th>Date</th><th>Author</th><th>Comment</th><th></th></tr></thead>
  <tbody>
  {{range .Data.Revisions}}
  <tr>
    <td><a href="/wiki/{{$.Data.Page.Slug}}/history/{{.Version}}">{{.Version}}</a></td>
    <td>{{date .CreatedAt}}</td>
    <td>{{.Author}}</td>
    <td>{{.Comment}}</td>
    <td>{{if and ($.Can "page.edit") (ne .Version $.Data.Page.Version)}}<a href="/wiki/{{$.Data.Page.Slug}}/edit?from={{.Version}}">Restore</a>{{end}}</td>
  </tr>
  {{end}}
  </tbody>
</table>
{{end}}
