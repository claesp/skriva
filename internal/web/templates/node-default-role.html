{{define "content"}}
{{template "nodehead" .}}
{{with .Data}}
<div class="pagehead"><h1>{{if .Node.IsFolder}}{{thtml "Default role of folder \"%s\"" .Node.Title}}{{else}}{{thtml "Default role of document \"%s\"" .Node.Title}}{{end}}</h1></div>
<form method="post" action="{{$.SpacePath}}/access/{{.Node.PublicID}}/default-role" class="stack">
  {{template "csrf" $.CSRF}}
  <label>{{if .Node.IsFolder}}{{t "Default role of all signed-in users in this folder"}}{{else}}{{t "Default role of all signed-in users in this document"}}{{end}}
    <select name="default_role" autofocus>
      <option value="-"{{if eq .DefaultRole "-"}} selected{{end}}>{{t "Same as the parent (folder, document or space)"}}</option>
      <option value=""{{if eq .DefaultRole ""}} selected{{end}}>{{t "None. Only users with a role binding have access."}}</option>
      {{range .Roles}}<option value="{{.Name}}"{{if eq .Name $.Data.DefaultRole}} selected{{end}}>{{.Name}}</option>{{end}}
    </select>
  </label>
  <div class="buttons"><button type="submit">{{t "Save"}}</button></div>
</form>
{{end}}
{{template "nodefoot"}}
{{end}}
