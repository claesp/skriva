{{define "content"}}
{{with .Data}}
{{$back := print $.SpacePath "/access/" .Node.PublicID}}
{{template "formhead" (crumb $back .Node.Title "Default role")}}
<form method="post" action="{{$back}}/default-role" class="stack narrow">
  {{template "csrf" $.CSRF}}
  <label>Default role of all signed-in users in this {{.Node.Kind}}
    <select name="default_role" autofocus>
      <option value="-"{{if eq .DefaultRole "-"}} selected{{end}}>Same as the parent (folder, document or space)</option>
      <option value=""{{if eq .DefaultRole ""}} selected{{end}}>None. Only users with a role binding have access.</option>
      {{range .Roles}}<option value="{{.Name}}"{{if eq .Name $.Data.DefaultRole}} selected{{end}}>{{.Name}}</option>{{end}}
    </select>
  </label>
  {{template "savebuttons" $back}}
</form>
{{end}}
{{end}}
