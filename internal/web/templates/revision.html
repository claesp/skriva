{{define "content"}}
{{with .Data}}
<p class="notice">This is version {{.Revision.Version}} from {{date .Revision.CreatedAt}}{{with .Revision.Author}} by {{.}}{{end}}.
  <a href="{{docpath $.SpacePath .Node.PublicID .Node.Slug}}">Go to the current version</a>.
  {{if $.Can "doc.edit"}}<a href="{{$.SpacePath}}/edit/{{.Node.PublicID}}?from={{.Revision.Version}}">Restore this version</a>.{{end}}</p>
<h1>{{.Revision.Title}}</h1>
<article class="markdown">{{.HTML}}</article>
{{end}}
{{end}}
