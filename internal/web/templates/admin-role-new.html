{{define "content"}}
{{template "formhead" (crumb (print .TenantPath "/admin/roles") (t "Roles") (t "New role") "new")}}
<form method="post" action="{{.TenantPath}}/admin/roles" class="stack">
  {{template "csrf" .CSRF}}
  <label>{{thtml "Name (a-z, 0-9, \"-\")"}} <input name="name" required maxlength="63" pattern="[a-z][a-z0-9\-]{0,62}" autofocus></label>
  <label>{{t "Description"}} <input name="description" maxlength="500"></label>
  <fieldset>
    <legend>{{t "Permissions"}}</legend>
    {{range .Data}}
    <label class="check"><input type="checkbox" name="permission" value="{{.}}"> <code>{{.}}</code>: {{permtext .}}</label>
    {{end}}
  </fieldset>
  {{template "savebutton"}}
</form>
{{end}}
