{{define "content"}}
{{with .Data}}
<h1>Delete {{.Node.Kind}}</h1>
<p>Do you want to delete "{{.Node.Title}}" and all its history?
{{if .Descendants}}This also deletes <strong>{{.Descendants}}</strong> items in it.{{end}}
You cannot undo this.</p>
<form action="{{$.SpacePath}}/delete/{{.Node.PublicID}}" method="post" class="buttons">
  {{template "csrf" $.CSRF}}
  <button type="submit" class="danger">Delete</button>
  <a href="{{docpath $.SpacePath .Node.PublicID .Node.Slug}}">Cancel</a>
</form>
{{end}}
{{end}}
