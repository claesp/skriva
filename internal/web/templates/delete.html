{{define "content"}}
<h1>Delete page</h1>
<p>Do you want to delete the page "{{.Data.Title}}" and all its history? You cannot undo this.</p>
<form action="/wiki/{{.Data.Slug}}/delete" method="post" class="buttons">
  {{template "csrf" .CSRF}}
  <button type="submit" class="danger">Delete</button>
  <a href="/wiki/{{.Data.Slug}}">Cancel</a>
</form>
{{end}}
