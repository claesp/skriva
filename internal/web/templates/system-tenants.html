{{define "content"}}
<div class="pagehead">
  <h1>Tenants</h1>
  <nav class="actions"><a class="button" href="/admin/tenants/new">New tenant</a></nav>
</div>
<table>
  <thead><tr><th>Code</th><th>Name</th><th>Identity provider</th><th>Status</th><th></th></tr></thead>
  <tbody>
  {{range .Data}}
  <tr>
    <td><a href="/admin/tenants/{{.Code}}"><code>{{.Code}}</code></a></td>
    <td>{{.Name}}{{if .IsDefault}} <span class="tag">default</span>{{end}}</td>
    <td>{{if .OIDCConfigured}}<code>{{.OIDCIssuer}}</code>{{else}}<span class="tag danger">Not set</span>{{end}}</td>
    <td>{{if .Disabled}}<span class="tag danger">Disabled</span>{{else}}Active{{end}}</td>
    <td><a href="/{{.Code}}/">Open</a></td>
  </tr>
  {{end}}
  </tbody>
</table>
{{end}}
