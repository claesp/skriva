{{define "content"}}
{{template "nodehead" .}}
{{with .Data}}
<div class="pagehead"><h1>{{thtml "Move \"%s\"" .Node.Title}}</h1></div>
<form action="{{$.SpacePath}}/move/{{.Node.PublicID}}" method="post" class="stack">
  {{template "csrf" $.CSRF}}
  <label>{{t "New place"}}
    <select name="parent">
      {{if .RootOpen}}<option value=""{{if .AtRoot}} selected{{end}}>{{t "(Top of the space)"}}</option>{{end}}
      {{range .Targets}}<option value="{{.PublicID}}"{{if .Selected}} selected{{end}}>{{.Label}}</option>{{end}}
    </select>
  </label>
  {{if .Node.IsFolder}}<p><small>{{t "A folder can be only in a folder."}}</small></p>{{end}}
  <div class="buttons"><button type="submit">{{t "Save"}}</button></div>
</form>
{{end}}
{{template "nodefoot"}}
{{end}}
