{{define "content"}}
{{template "formhead" (crumb (print .TenantPath "/admin/groups") (t "Groups") (t "New local group") "new")}}
<form method="post" action="{{.TenantPath}}/admin/groups" class="stack">
  {{template "csrf" .CSRF}}
  <label>{{t "Name"}} <input name="name" required maxlength="200" autofocus></label>
  <label>{{t "Description"}} <input name="description" maxlength="500"></label>
  {{template "savebutton"}}
</form>
{{end}}
