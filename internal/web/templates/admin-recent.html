{{define "content"}}
{{template "listhead" (head (t "Recent changes"))}}
<p>{{t "The documents that changed last, in all spaces."}}</p>
<table>
  <thead><tr><th>{{t "Document"}}</th><th>{{t "Space"}}</th><th class="date">{{t "Changed"}}</th></tr></thead>
  <tbody>
  {{range .Data}}
  <tr>
    <td><a href="{{docpath (print $.TenantPath "/" .SpaceSlug) .PublicID .Slug}}">{{.Title}}</a></td>
    <td>{{.SpaceName}}</td>
    <td class="date">{{date .UpdatedAt}}</td>
  </tr>
  {{else}}
  <tr><td colspan="3">{{t "There are no documents."}}</td></tr>
  {{end}}
  </tbody>
</table>
{{end}}
