{{define "content"}}
{{with .Data.Space}}
{{$s := print $.TenantPath "/admin/spaces/" .Slug}}
{{template "formhead" (crumb3 (print $.TenantPath "/admin/spaces") "Spaces" $s .Name "Settings" "edit")}}
<form method="post" action="{{$s}}" class="stack">
  {{template "csrf" $.CSRF}}
  <label>Name <input name="name" value="{{.Name}}" required maxlength="200" autofocus></label>
  <label>Description <input name="description" value="{{.Description}}" maxlength="500"></label>
  {{template "savebutton"}}
</form>
{{end}}
{{end}}
